<!DOCTYPE html>

<head>
  <title>Third Place Bicycles</title>

  <link rel="icon" type="image/x-icon" href="favicon.png">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="style.css">

  <style>

    body {
      text-align: center;
      background: white;
    }

    h1 {
      font-family: "Gill Sans", "Gill Sans MT", Calibri, sans-serif;
      font-weight: normal;
    }

    p {
      font-family: "Gill Sans", "Gill Sans MT", Calibri, sans-serif;
      font-weight: normal;
    }

    /* 3D SCENE */
    .scene {
      width: 25vw;
      max-width: 400px;
      aspect-ratio: 1 / 1;

      margin: 50px auto;

      perspective: 1200px;
    }

    /* ROTATING OBJECT */
    .logo-card {
      width: 100%;
      height: 100%;

      position: relative;

      transform-style: preserve-3d;

      animation: spin3d 10s linear infinite;
    }

    /* BOTH SIDES */
    .face {
      position: absolute;

      width: 100%;
      height: 100%;

      backface-visibility: hidden;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .face img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* FRONT */
    .front {
      transform: rotateY(0deg);
    }

    /* BACK */
    .back {
      transform: rotateY(180deg);
    }

    /* TRUE 3D ROTATION */
    @keyframes spin3d {

      from {
        transform:
          rotateX(0deg)
          rotateY(0deg);
      }

      to {
        transform:
          rotateX(0deg)
          rotateY(360deg);
      }
    }

  </style>

</head>

<body>

  <!-- 3D LOGO -->
  <div class="scene">

    <div class="logo-card">

      <!-- FRONT IMAGE -->
      <div class="face front">
        <img src="TPB.png">
      </div>

      <!-- BACK IMAGE -->
      <div class="face back">

      </div>

    </div>
